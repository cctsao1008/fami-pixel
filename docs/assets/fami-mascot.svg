<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-labelledby="title desc">
  <title id="title">Fami mascot</title>
  <desc id="desc">A playful retro game scout robot with a CRT face, radar eye, controller, cape, and Sagittarius arrow antenna.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#071321" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#eadfc8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#08101f"/>
    </linearGradient>
  </defs>

  <ellipse cx="210" cy="329" rx="96" ry="15" fill="#cbd7e7" opacity="0.55"/>

  <!-- future-rollout ghosts -->
  <g opacity="0.2" fill="#6bc7ff" stroke="#2182d8" stroke-width="3">
    <g transform="translate(34 88) scale(.56)"><rect x="0" y="0" width="128" height="78" rx="24"/><circle cx="40" cy="39" r="12" fill="#102642"/><circle cx="88" cy="39" r="12" fill="#102642"/></g>
    <g transform="translate(307 60) scale(.48)"><rect x="0" y="0" width="128" height="78" rx="24"/><circle cx="40" cy="39" r="12" fill="#102642"/><circle cx="88" cy="39" r="12" fill="#102642"/></g>
    <g transform="translate(316 154) scale(.38)"><rect x="0" y="0" width="128" height="78" rx="24"/><circle cx="40" cy="39" r="12" fill="#102642"/><circle cx="88" cy="39" r="12" fill="#102642"/></g>
  </g>

  <!-- cape -->
  <path d="M137 179 C91 183 70 218 83 257 C112 240 139 235 159 242 Z" fill="#e53f45" stroke="#8c2028" stroke-width="6"/>

  <!-- body -->
  <g filter="url(#shadow)">
    <rect x="116" y="72" width="194" height="132" rx="42" fill="url(#shell)" stroke="#453d3a" stroke-width="7"/>
    <rect x="137" y="93" width="152" height="89" rx="22" fill="url(#screen)" stroke="#453d3a" stroke-width="6"/>

    <!-- left eye: forward arrow -->
    <path d="M170 130 h26 m-13 -13 13 13 -13 13" fill="none" stroke="#70c7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- right eye: radar -->
    <circle cx="246" cy="137" r="21" fill="none" stroke="#78e36d" stroke-width="5"/>
    <circle cx="246" cy="137" r="7" fill="#78e36d"/>
    <path d="M246 108 v58 M217 137 h58" stroke="#78e36d" stroke-width="3" opacity="0.8"/>
    <path d="M246 137 l15 -12" stroke="#fff176" stroke-width="4" stroke-linecap="round"/>

    <!-- headset -->
    <circle cx="112" cy="137" r="25" fill="#40495b" stroke="#453d3a" stroke-width="6"/>
    <circle cx="314" cy="137" r="25" fill="#40495b" stroke="#453d3a" stroke-width="6"/>
    <circle cx="112" cy="137" r="11" fill="#e64b50"/>
    <circle cx="314" cy="137" r="11" fill="#e64b50"/>

    <!-- neck / torso -->
    <path d="M178 204 v19 M248 204 v19" stroke="#453d3a" stroke-width="7" stroke-linecap="round"/>
    <rect x="151" y="218" width="126" height="75" rx="30" fill="#f5efe2" stroke="#453d3a" stroke-width="7"/>
    <rect x="176" y="237" width="76" height="34" rx="11" fill="#15233c" stroke="#453d3a" stroke-width="5"/>
    <circle cx="195" cy="254" r="6" fill="#ff5a62"/>
    <circle cx="214" cy="254" r="6" fill="#ffd54c"/>
    <circle cx="233" cy="254" r="6" fill="#68e07a"/>

    <!-- arms + controller -->
    <path d="M157 245 C127 245 116 260 109 276" fill="none" stroke="#f5efe2" stroke-width="19" stroke-linecap="round"/>
    <path d="M272 244 C303 242 318 256 326 274" fill="none" stroke="#f5efe2" stroke-width="19" stroke-linecap="round"/>
    <rect x="106" y="267" width="218" height="47" rx="20" fill="#3f4658" stroke="#453d3a" stroke-width="6"/>
    <path d="M139 291 h28 M153 277 v28" stroke="#f7f4ea" stroke-width="7" stroke-linecap="round"/>
    <circle cx="286" cy="283" r="8" fill="#ff5a62"/>
    <circle cx="304" cy="298" r="8" fill="#ff5a62"/>

    <!-- little feet -->
    <path d="M174 294 q-17 15 -16 32 h45 q3 -18 -9 -32" fill="#6bbcf3" stroke="#453d3a" stroke-width="6"/>
    <path d="M231 294 q-8 17 -4 32 h45 q0 -18 -18 -32" fill="#6bbcf3" stroke="#453d3a" stroke-width="6"/>
  </g>

  <!-- Sagittarius antenna -->
  <path d="M224 71 C230 44 245 31 266 19" fill="none" stroke="#f5b82e" stroke-width="7" stroke-linecap="round"/>
  <path d="M252 19 h20 v20 M271 20 l-24 24" fill="none" stroke="#f5b82e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cheeky energy marks -->
  <path d="M83 182 l-18 -7 M91 164 l-12 -16 M337 199 l16 -10 M340 218 l20 1" stroke="#75caff" stroke-width="6" stroke-linecap="round"/>

  <text x="210" y="348" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#26334b">Fami · observe · simulate · commit · replan</text>
</svg>
